<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais Tabelas</title>
    <style>
        caption{
            background-color: black;
            color: white;
        } 
        thead{
            background-color: darkorange;
            color: white;
        }   
        tbody{
            background-color: honeydew;
        }                                               
        tfoot{
            background-color: grey;
            font-weight: bold;
        }
        table, td, th {
            border: 1px solid rgb(0, 0, 0);
        }
    </style>
</head>
<body>
    <table border="1">
        <caption>Listagem de Produtos</caption>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>10</td>
                <td>R$ 2.500,00</td>
            </tr>
            <tr>
                <td>Tablet</td>
                <td>2</td>
                <td>R$ 1.000,00</td>
            </tr>
        </tbody>    
        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>R$ 3.500,00</td>
            </tr>           

        </tfoot>

    </table>
</body>
</html>
